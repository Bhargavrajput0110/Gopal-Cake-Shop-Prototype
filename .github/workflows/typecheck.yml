name: TypeScript Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Run TypeScript check
        run: npx tsc --noEmit --skipLibCheck

      - name: Check for stray test/scratch files
        run: |
          # Fail if any test-*.ts files exist at src root (not in tests/ directory)
          count=$(find src -maxdepth 1 -name "test-*.ts" -o -name "test-*.js" | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "❌ Found scratch/test files in src/ root:"
            find src -maxdepth 1 -name "test-*.ts" -o -name "test-*.js"
            echo "Move them to scratch/ directory before committing."
            exit 1
          fi
          echo "✅ No stray test files found."
